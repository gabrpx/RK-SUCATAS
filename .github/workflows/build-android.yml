name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # `secrets` não pode ser lido direto num `if:` de step (não é um
    # contexto disponível ali) — espelha pra uma env de job, que os steps
    # já conseguem checar em `if: env.X != ''`.
    env:
      CAPGO_API_KEY: ${{ secrets.CAPGO_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Ensure Android platform exists
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      # Credencial real do projeto Firebase dedicado (Cloud Messaging) — vem
      # de secret, nunca fica versionada. Sem esse secret configurado, o
      # arquivo fica vazio e o build do Android segue normal (o
      # build.gradle já trata google-services.json ausente/vazio sem quebrar,
      # só o push nativo FCM que não funciona até isso ser configurado).
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK output
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk

      # Publica o bundle web (JS/CSS/assets) pro Capgo — apps já instalados
      # baixam essa atualização sozinhos em background (CapacitorUpdater com
      # autoUpdate:true, ver capacitor.config.ts) sem precisar reinstalar o
      # APK. Só cobre mudança de JS/tela: mudança em código nativo (plugin
      # novo, permissão nova, etc.) exige reinstalar o APK publicado abaixo.
      # continue-on-error: um commit que não muda nada em dist/ (ex: só uma
      # migration .sql) não tem por que travar o release do APK abaixo — sem
      # isso, esquecer de subir a versão do package.json faz o Capgo recusar
      # reenviar o mesmo número (“Version X já existe”) e os passos seguintes
      # (release do APK, upload do artifact) ficam pulados de arrasto.
      - name: Publish OTA update (Capgo)
        if: ${{ env.CAPGO_API_KEY != '' }}
        continue-on-error: true
        run: npx @capgo/cli@latest bundle upload com.rksucatas.app --path ./dist --channel production --apikey "$CAPGO_API_KEY"

      # Release fixa (mesma tag sempre) com o APK mais recente — link estável
      # pra instalar/reinstalar, em vez de depender do artifact do Actions
      # (expira em 30 dias e exige estar logado no GitHub).
      - name: Publish latest APK (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: APK mais recente
          body: |
            Build automático a partir do commit ${{ github.sha }}.

            Reinstale este APK só quando a mudança envolver código nativo (novo plugin Capacitor, nova permissão, etc). Mudanças só de tela/JS chegam sozinhas no app já instalado via atualização automática (Capgo).
          files: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rk-sucatas-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
