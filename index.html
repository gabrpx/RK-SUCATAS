    <!-- PWA: instalável via "Adicionar à Tela de Início" (Android/Chrome e,
         principalmente, Safari no iPhone — é o único caminho pra receber Web
         Push no iOS, que não suporta instalar .apk). Ícones vêm de /public,
         referenciados com caminho absoluto de propósito: diferente do
         script/CSS do bundle (que usam base:'./' pro Capacitor), esses
         arquivos não passam pelo pipeline de asset do Vite, então o caminho
         final é sempre a raiz do que estiver servindo o dist/, seja o
         WebView do Capacitor (https://localhost/) ou o domínio real. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RK Sucatas" />
  </head>
